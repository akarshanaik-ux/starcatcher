<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Starcatcher — Wish Upon a Shooting Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #05060d;
    --bg-mid: #0a0d1f;
    --bg-soft: #11142a;
    --star: #ffffff;
    --star-warm: #fff4d6;
    --star-cool: #d6e6ff;
    --accent: #f9e7a8;
    --text: #f3ecd8;
    --text-soft: rgba(243, 236, 216, 0.65);
    --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: var(--font-body);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body.catching { cursor: crosshair; }
  body.catching .prompt,
  body.catching .hint { opacity: 0.4; transition: opacity 0.4s ease; }

  /* Layered cosmos background */
  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(40, 30, 80, 0.35), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(20, 40, 80, 0.3), transparent 60%),
      radial-gradient(ellipse at 50% 50%, var(--bg-mid), var(--bg-deep) 80%);
    overflow: hidden;
  }

  /* Subtle nebula drift */
  .nebula {
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 80, 180, 0.08), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(80, 140, 220, 0.08), transparent 40%);
    filter: blur(40px);
    animation: drift 60s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate(0, 0) rotate(0deg); }
    to   { transform: translate(-3%, 2%) rotate(3deg); }
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Shooting star layer — pointer events handled at document level when active */
  #shootingLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .shooter {
    position: absolute;
    pointer-events: none; /* we handle catching globally while active */
    transform-origin: center;
    will-change: transform, opacity;
  }

  .shooter svg {
    display: block;
    filter: drop-shadow(0 0 8px rgba(255, 244, 214, 0.9))
            drop-shadow(0 0 20px rgba(255, 220, 140, 0.5));
  }

  /* Header */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: clamp(16px, 3vw, 28px) clamp(20px, 4vw, 40px);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    z-index: 5;
    pointer-events: none;
  }

  .brand {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(18px, 2.2vw, 24px);
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .brand::before {
    content: "✦ ";
    color: var(--accent);
    font-style: normal;
    margin-right: 2px;
  }

  .hint {
    font-size: clamp(10px, 1.2vw, 12px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 300;
  }

  /* Footer prompt */
  .prompt {
    position: fixed;
    bottom: clamp(20px, 4vw, 36px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
    width: 90%;
    max-width: 560px;
  }

  .prompt .lead {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(16px, 2.4vw, 22px);
    color: var(--text-soft);
    line-height: 1.4;
  }

  .prompt .sub {
    display: block;
    margin-top: 6px;
    font-size: clamp(9px, 1.1vw, 11px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(243, 236, 216, 0.35);
    font-weight: 300;
  }

  /* Message modal */
  .message-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 6, 13, 0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, backdrop-filter 0.6s ease;
    padding: 24px;
  }

  .message-overlay.active {
    opacity: 1;
    pointer-events: auto;
    background: rgba(5, 6, 13, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .message-card {
    position: relative;
    max-width: 640px;
    width: 100%;
    padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
    text-align: center;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  .message-overlay.active .message-card {
    transform: translateY(0) scale(1);
  }

  .ornament {
    display: inline-block;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 20px;
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }

  .message-text {
    font-family: var(--font-display);
    font-weight: 300;
    font-style: italic;
    font-size: clamp(22px, 4vw, 34px);
    line-height: 1.35;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .message-text::before,
  .message-text::after {
    color: var(--accent);
    font-family: var(--font-display);
    font-style: normal;
    opacity: 0.6;
  }
  .message-text::before { content: "“"; margin-right: 4px; }
  .message-text::after  { content: "”"; margin-left: 4px; }

  .message-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 28px auto 20px;
    opacity: 0.7;
  }

  .dismiss {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-soft);
    background: transparent;
    border: 1px solid rgba(243, 236, 216, 0.25);
    padding: 12px 24px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 300;
    transition: all 0.3s ease;
  }
  .dismiss:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(249, 231, 168, 0.05);
  }

  /* Streak count — styled as a shooting-star trail */
  .counter {
    position: fixed;
    bottom: calc(clamp(20px, 4vw, 36px) + clamp(48px, 7vw, 70px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-display);
    color: var(--text-soft);
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
    /* fixed row height — all children centered inside it */
    height: clamp(28px, 3.4vw, 36px);
  }

  .counter .streak-icon,
  .counter .count,
  .counter .label {
    display: flex;
    align-items: center;
    height: 100%;
  }

  /* Inline SVG streak icon */
  .streak-icon {
    width: clamp(52px, 6.5vw, 68px);
    flex-shrink: 0;
  }
  .streak-icon svg {
    width: 100%;
    height: 60%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 5px rgba(249, 231, 168, 0.85))
            drop-shadow(0 0 10px rgba(249, 231, 168, 0.45));
  }

  .counter .count {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(26px, 3.2vw, 34px);
    line-height: 1;
    min-width: 0.8ch;
    /* italic serif digits have a tiny baseline overhang — nudge up to center optically */
    position: relative;
    top: -0.05em;
  }

  .counter .label {
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-family: var(--font-body);
    font-size: clamp(10px, 1.2vw, 12px);
    font-weight: 300;
    color: rgba(243, 236, 216, 0.55);
    line-height: 1;
  }

  /* Share screenshot button — sits in the counter row */
  .share-btn {
    pointer-events: auto;
    cursor: pointer;
    background: transparent;
    border: 1px solid rgba(243, 236, 216, 0.25);
    border-radius: 999px;
    width: clamp(30px, 3.4vw, 36px);
    height: clamp(30px, 3.4vw, 36px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 4px;
    color: rgba(243, 236, 216, 0.7);
    transition: all 0.25s ease;
    flex-shrink: 0;
  }
  .share-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(249, 231, 168, 0.08);
    transform: scale(1.05);
  }
  .share-btn:active { transform: scale(0.95); }
  .share-btn svg {
    width: 55%;
    height: 55%;
    display: block;
  }
  .share-btn.working {
    pointer-events: none;
    opacity: 0.6;
  }
  .share-btn.working svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast for share feedback (reuses miss-toast positioning, different color) */
  .share-toast {
    position: fixed;
    bottom: calc(clamp(20px, 4vw, 36px) + clamp(48px, 7vw, 70px) + clamp(36px, 5vw, 48px));
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(13px, 1.6vw, 16px);
    color: var(--accent);
    z-index: 12;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .share-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .share-toast::before {
    content: "✦ ";
    color: rgba(249, 231, 168, 0.8);
    font-style: normal;
  }

  /* Share popup modal */
  .share-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 6, 13, 0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    z-index: 11;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, backdrop-filter 0.5s ease;
    padding: 24px;
  }
  .share-overlay.active {
    opacity: 1;
    pointer-events: auto;
    background: rgba(5, 6, 13, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .share-card {
    position: relative;
    max-width: 440px;
    width: 100%;
    padding: clamp(28px, 5vw, 40px);
    text-align: center;
    transform: translateY(16px) scale(0.96);
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .share-overlay.active .share-card { transform: translateY(0) scale(1); }

  .share-title {
    font-family: var(--font-display);
    font-weight: 300;
    font-style: italic;
    font-size: clamp(22px, 3.2vw, 28px);
    color: var(--text);
    margin-bottom: 8px;
  }
  .share-sub {
    font-size: clamp(11px, 1.3vw, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 300;
    margin-bottom: 28px;
  }

  /* Preview thumbnail */
  .share-preview {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 16 / 10;
    margin: 0 auto 28px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(243, 236, 216, 0.12);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-soft);
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .share-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .share-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .share-action {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text);
    background: transparent;
    border: 1px solid rgba(243, 236, 216, 0.3);
    padding: 14px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 400;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .share-action:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(249, 231, 168, 0.06);
  }
  .share-action:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .share-action.primary {
    background: rgba(249, 231, 168, 0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .share-action.primary:hover:not(:disabled) {
    background: rgba(249, 231, 168, 0.2);
  }
  .share-action svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .share-action .status {
    font-size: 10px;
    opacity: 0.7;
    text-transform: none;
    letter-spacing: 0.05em;
    font-style: italic;
    margin-left: 4px;
  }

  .share-close {
    margin-top: 18px;
    background: transparent;
    border: none;
    color: var(--text-soft);
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 12px;
    font-weight: 300;
  }
  .share-close:hover { color: var(--text); }

  /* Visual reactions */
  .counter.bump .count {
    animation: streakBump 0.5s ease-out;
  }
  @keyframes streakBump {
    0%   { transform: scale(1); color: var(--accent); }
    40%  { transform: scale(1.35); color: #fffbe6; text-shadow: 0 0 12px rgba(249, 231, 168, 0.9); }
    100% { transform: scale(1); color: var(--accent); text-shadow: none; }
  }

  .counter.break .count {
    animation: streakBreak 0.7s ease-out;
  }
  .counter.break .streak-icon {
    animation: streakBreakIcon 0.7s ease-out;
  }
  @keyframes streakBreak {
    0%   { transform: scale(1);   color: var(--accent); }
    15%  { transform: scale(1.2) translateX(-3px); color: #ff8a8a; text-shadow: 0 0 10px rgba(255, 138, 138, 0.8); }
    30%  { transform: scale(1.1) translateX(3px);  color: #ff8a8a; }
    50%  { transform: scale(1) translateX(-2px); color: #ff8a8a; }
    100% { transform: scale(1) translateX(0); color: var(--text-soft); text-shadow: none; }
  }
  @keyframes streakBreakIcon {
    0%, 100% { opacity: 1; filter: none; }
    15%, 50% { opacity: 0.3; filter: grayscale(1); }
  }

  /* Miss dialogue — a little italic line that slips in above the streak */
  .miss-toast {
    position: fixed;
    bottom: calc(clamp(20px, 4vw, 36px) + clamp(48px, 7vw, 70px) + clamp(36px, 5vw, 48px));
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(13px, 1.6vw, 16px);
    color: rgba(255, 200, 200, 0.85);
    letter-spacing: 0.02em;
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .miss-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .miss-toast::before {
    content: "✦ ";
    color: rgba(255, 160, 160, 0.7);
    font-style: normal;
  }

  @media (max-width: 600px) {
    .miss-toast { white-space: normal; text-align: center; line-height: 1.35; }
  }

  /* Trail effect for caught star */
  .catch-burst {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249, 231, 168, 0.8), transparent 70%);
    pointer-events: none;
    animation: burst 0.8s ease-out forwards;
    z-index: 3;
  }

  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(4);   opacity: 0; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .nebula, .ornament { animation: none; }
  }

  /* Mobile */
  @media (max-width: 600px) {
    .header { align-items: flex-start; flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

<div class="sky">
  <div class="nebula"></div>
</div>

<canvas id="stars"></canvas>
<div id="shootingLayer"></div>

<header class="header">
  <div class="brand">Starcatcher</div>
  <div class="hint">Listen closely, the universe wants to tell you something</div>
</header>

<div class="counter" id="counter">
  <span class="streak-icon" aria-hidden="true">
    <svg viewBox="0 0 64 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="streakTail" x1="0" x2="1" y1="0.5" y2="0.5">
          <stop offset="0%"   stop-color="rgba(249, 231, 168, 0)"/>
          <stop offset="100%" stop-color="rgba(249, 231, 168, 0.9)"/>
        </linearGradient>
      </defs>
      <!-- tapered trail -->
      <path d="M 0 12 Q 25 11 46 12 Q 25 13 0 12 Z" fill="url(#streakTail)"/>
      <!-- Cross/X-shaped sparkle: two rotated rectangles forming an X, with a bright core -->
      <g transform="translate(52 12)">
        <!-- diagonal arm 1 -->
        <rect x="-11" y="-1.2" width="22" height="2.4" rx="1.2" fill="#f9e7a8" transform="rotate(45)"/>
        <!-- diagonal arm 2 -->
        <rect x="-11" y="-1.2" width="22" height="2.4" rx="1.2" fill="#f9e7a8" transform="rotate(-45)"/>
        <!-- bright core -->
        <circle r="2.2" fill="#fffbe6"/>
      </g>
    </svg>
  </span>
  <span class="count" id="countNum">0</span>
  <span class="label">streak</span>
  <button class="share-btn" id="shareBtn" title="Share your sky" aria-label="Capture screenshot and copy to clipboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>
</div>

<div class="share-toast" id="shareToast" aria-live="polite"></div>

<div class="share-overlay" id="shareOverlay" role="dialog" aria-label="Share your starry sky">
  <div class="share-card">
    <div class="share-title">Share your sky</div>
    <div class="share-sub">A little light for someone's day</div>
    <div class="share-preview" id="sharePreview">Preparing preview…</div>
    <div class="share-actions">
      <button class="share-action primary" id="copyImgBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy image <span class="status" id="copyStatus"></span>
      </button>
      <button class="share-action" id="downloadImgBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download image
      </button>
    </div>
    <button class="share-close" id="shareCloseBtn">Close</button>
  </div>
</div>

<div class="miss-toast" id="missToast" aria-live="polite"></div>

<div class="prompt">
  <p class="lead">A star is about to fall. Try not to blink.</p>
  <span class="sub">Tap anywhere when you see it</span>
</div>

<div class="message-overlay" id="overlay" role="dialog" aria-live="polite" aria-label="Message from a shooting star">
  <div class="message-card">
    <div class="ornament">✦</div>
    <p class="message-text" id="messageText"></p>
    <div class="message-divider"></div>
    <button class="dismiss" id="dismissBtn">Close</button>
  </div>
</div>

<script>
(() => {
  // ---------- Positive Messages ----------
  const messages = [
    // ——— catching the star itself ———
    "You caught a star. Most people just scroll. Respect.",
    "The universe sent this. Reply when convenient.",
    "You caught a falling star. That's a whole Disney song's worth of luck.",

  // ---------- Twinkling Stars (canvas) ----------
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  let stars = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
  }

  function initStars() {
    const density = Math.min(w, h) < 600 ? 0.00022 : 0.00018;
    const count = Math.floor(w * h * density);
    stars = [];

    // Weighted palette — white dominates so it still reads as a night sky,
    // but colored stars are frequent enough to feel magical.
    const palette = [
      { name: 'white',  weight: 42, color: [255, 255, 255] },
      { name: 'warm',   weight: 12, color: [255, 240, 200] }, // soft warm white
      { name: 'yellow', weight: 10, color: [255, 225, 140] },
      { name: 'pink',   weight: 9,  color: [255, 185, 210] },
      { name: 'purple', weight: 8,  color: [200, 170, 255] },
      { name: 'blue',   weight: 10, color: [160, 200, 255] },
      { name: 'green',  weight: 5,  color: [170, 240, 210] },
      { name: 'cyan',   weight: 4,  color: [170, 230, 240] }
    ];
    const totalWeight = palette.reduce((s, p) => s + p.weight, 0);

    function pickColor() {
      let r = Math.random() * totalWeight;
      for (const p of palette) {
        r -= p.weight;
        if (r <= 0) return p;
      }
      return palette[0];
    }

    for (let i = 0; i < count; i++) {
      const size = Math.pow(Math.random(), 2) * 2.2 + 0.4; // smaller skewed
      const pick = pickColor();

      // Three twinkle personalities for variety:
      // - "blinker": fast sharp on/off (uses a power curve so it spends more time dim)
      // - "pulser": slow gentle sine pulse
      // - "steady": barely twinkles, just ambient
      const roll = Math.random();
      let style, speed, depth, sharpness;
      if (roll < 0.35) {
        style = 'blinker';
        speed = 1.8 + Math.random() * 2.4;   // fast
        depth = 0.85 + Math.random() * 0.15; // dips nearly to zero
        sharpness = 2 + Math.random() * 3;   // higher = sharper blink
      } else if (roll < 0.8) {
        style = 'pulser';
        speed = 0.4 + Math.random() * 1.2;   // slow
        depth = 0.5 + Math.random() * 0.35;  // moderate dip
        sharpness = 1;
      } else {
        style = 'steady';
        speed = 0.2 + Math.random() * 0.5;
        depth = 0.15 + Math.random() * 0.2;  // barely twinkles
        sharpness = 1;
      }

      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: size,
        baseAlpha: 0.35 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        speed,
        depth,
        sharpness,
        style,
        color: pick.color,
        // 4-point star only for larger stars
        spiky: size > 1.3
      });
    }
  }

  function drawFourPointStar(x, y, r, alpha, rgb) {
    // Draw a crisp four-pointed star (classic "sparkle")
    const [cr, cg, cb] = rgb;
    const solid = `rgba(${cr}, ${cg}, ${cb}, 1)`;
    const glowStrong = `rgba(${cr}, ${cg}, ${cb}, 0.55)`;
    const glowMid = `rgba(${cr}, ${cg}, ${cb}, 0.15)`;

    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;

    // Soft colored glow behind the star
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 4);
    glow.addColorStop(0, glowStrong);
    glow.addColorStop(0.35, glowMid);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 4, 0, Math.PI * 2);
    ctx.fill();

    // The 4-point star shape — two elongated diamonds rotated 90°
    ctx.fillStyle = solid;
    ctx.beginPath();
    const long = r * 3.2;
    const short = r * 0.45;
    // vertical spike
    ctx.moveTo(0, -long);
    ctx.lineTo(short, 0);
    ctx.lineTo(0, long);
    ctx.lineTo(-short, 0);
    ctx.closePath();
    // horizontal spike
    ctx.moveTo(-long, 0);
    ctx.lineTo(0, -short);
    ctx.lineTo(long, 0);
    ctx.lineTo(0, short);
    ctx.closePath();
    ctx.fill();

    // Bright near-white center for a sparkle pop
    ctx.fillStyle = `rgba(${Math.min(255, cr + 40)}, ${Math.min(255, cg + 40)}, ${Math.min(255, cb + 40)}, 1)`;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawDot(x, y, r, alpha, rgb) {
    const [cr, cg, cb] = rgb;
    ctx.save();
    ctx.globalAlpha = alpha;
    // tiny glow for colored dots to make their hue readable
    if (r > 0.8) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
      g.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, 0.5)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, 1)`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let lastTime = 0;
  function render(t) {
    const dt = (t - lastTime) / 1000 || 0;
    lastTime = t;
    ctx.clearRect(0, 0, w, h);

    for (const s of stars) {
      s.phase += dt * s.speed;
      // sine wave 0..1
      let t = (Math.sin(s.phase) + 1) / 2;
      // sharpness curve — higher power values spend more time near 0, creating a "blink" feel
      if (s.sharpness !== 1) t = Math.pow(t, s.sharpness);
      // depth controls how much brightness varies: high depth = can go nearly dark
      const brightness = (1 - s.depth) + t * s.depth;
      const alpha = s.baseAlpha * brightness;

      if (alpha < 0.01) continue; // skip nearly invisible

      if (s.spiky) {
        drawFourPointStar(s.x, s.y, s.r, alpha, s.color);
      } else {
        drawDot(s.x, s.y, s.r, alpha, s.color);
      }
    }

    requestAnimationFrame(render);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(render);

  // ---------- Shooting Stars ----------
  const layer = document.getElementById('shootingLayer');
  const overlay = document.getElementById('overlay');
  const messageEl = document.getElementById('messageText');
  const dismissBtn = document.getElementById('dismissBtn');
  const countEl = document.getElementById('countNum');

  let streak = 0;
  let shownMessages = new Set();
  let activeStar = null; // currently-falling star that can be caught
  const counterEl = document.getElementById('counter');
  const missToastEl = document.getElementById('missToast');
  let missToastTimer = null;

  const missLines = [
    "Oh no, you missed one. Good thing there are billions of stars in the sky.",
    "Whoops. The universe is patient. Mostly.",
    "Missed it. Blink less. Believe more.",
    "Gone. Don't worry — the sky's got more where that came from.",
    "That one got away. The next one is yours.",
    "Snooze, lose. Another is coming.",
    "Too slow. The stars don't wait for anyone.",
    "Reflexes: 0. Sky: 1. Rematch incoming."
  ];
  // Use the user's requested line first, then a shuffled mix.
  let missLineIndex = 0;

  function showMissToast() {
    const line = missLines[missLineIndex % missLines.length];
    missLineIndex++;
    missToastEl.textContent = line;
    missToastEl.classList.remove('show');
    void missToastEl.offsetWidth; // restart transition
    missToastEl.classList.add('show');
    if (missToastTimer) clearTimeout(missToastTimer);
    missToastTimer = setTimeout(() => {
      missToastEl.classList.remove('show');
    }, 3200);
  }

  function pickMessage() {
    // avoid repeats until pool is exhausted
    if (shownMessages.size >= messages.length) shownMessages.clear();
    let m;
    do { m = messages[Math.floor(Math.random() * messages.length)]; }
    while (shownMessages.has(m));
    shownMessages.add(m);
    return m;
  }

  function showMessage(text) {
    messageEl.textContent = text;
    overlay.classList.add('active');
  }

  function hideMessage() {
    overlay.classList.remove('active');
  }

  dismissBtn.addEventListener('click', hideMessage);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) hideMessage();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideMessage();
  });

  // Global catch handler — if a star is currently falling, a tap anywhere catches it.
  function handleGlobalCatch(e) {
    if (!activeStar || activeStar.caught) return;
    // Don't count taps inside the message overlay (it's already being shown/dismissed)
    if (overlay.classList.contains('active')) return;

    activeStar.caught = true;
    const star = activeStar.element;

    // Burst at the tap position (or current star position for keyboard, etc.)
    let bx, by;
    if (e && (e.clientX !== undefined)) {
      bx = e.clientX; by = e.clientY;
    } else {
      const rect = star.getBoundingClientRect();
      bx = rect.left + rect.width * 0.85;
      by = rect.top + rect.height / 2;
    }
    const burst = document.createElement('div');
    burst.className = 'catch-burst';
    burst.style.left = bx + 'px';
    burst.style.top = by + 'px';
    document.body.appendChild(burst);
    setTimeout(() => burst.remove(), 800);

    // Cancel the running animation and fade the star out
    if (activeStar.animation) activeStar.animation.cancel();
    star.style.transition = 'opacity 0.25s ease';
    star.style.opacity = '0';

    streak++;
    countEl.textContent = streak;
    counterEl.classList.remove('break', 'bump');
    // force reflow so the animation restarts reliably
    void counterEl.offsetWidth;
    counterEl.classList.add('bump');
    // Clear any lingering miss toast when the user scores
    missToastEl.classList.remove('show');

    document.body.classList.remove('catching');
    const thisStar = activeStar;
    activeStar = null;

    setTimeout(() => {
      showMessage(pickMessage());
      if (thisStar.element.parentNode) thisStar.element.remove();
    }, 320);
  }

  // ---------- Screenshot / Share ----------
  const shareBtn = document.getElementById('shareBtn');
  const shareToast = document.getElementById('shareToast');
  const shareOverlay = document.getElementById('shareOverlay');
  const sharePreview = document.getElementById('sharePreview');
  const copyImgBtn = document.getElementById('copyImgBtn');
  const downloadImgBtn = document.getElementById('downloadImgBtn');
  const shareCloseBtn = document.getElementById('shareCloseBtn');
  const copyStatus = document.getElementById('copyStatus');
  let shareToastTimer = null;
  let currentShareBlob = null;

  // Use pointerdown so it works for mouse + touch consistently, and fires before click.
  document.addEventListener('pointerdown', handleGlobalCatch);

  // The page URL people are invited to visit. Uses the live URL so it's always correct.
  const SITE_URL = (() => {
    const u = window.location.href.split('#')[0].split('?')[0];
    // Strip trailing slash for cleaner display
    return u.endsWith('/') ? u.slice(0, -1) : u;
  })();
  const SHARE_TEXT = `Catch your own stars at ${SITE_URL}`;
  const SHARE_FULL_TEXT = `I caught a star and the universe had opinions. ✦ Catch your own at ${SITE_URL}`;

  function showShareToast(text) {
    shareToast.textContent = text;
    shareToast.classList.remove('show');
    void shareToast.offsetWidth;
    shareToast.classList.add('show');
    if (shareToastTimer) clearTimeout(shareToastTimer);
    shareToastTimer = setTimeout(() => {
      shareToast.classList.remove('show');
    }, 3000);
  }

  // Builds the share image by compositing the existing starfield canvas
  // with a drawn overlay of the key UI text. This is faster and far more
  // reliable than html2canvas-ing the whole DOM, which struggles with
  // <canvas> elements, backdrop-filters, and webfonts.
  function buildShareCanvas() {
    const starCanvas = document.getElementById('stars');
    const W = starCanvas.width;   // already at device pixel ratio
    const H = starCanvas.height;

    const out = document.createElement('canvas');
    const footerH = Math.max(70, Math.round(W * 0.055));
    out.width = W;
    out.height = H + footerH;
    const c = out.getContext('2d');

    // 1. Paint the sky background + nebula gradient so the image doesn't
    //    look flat like plain black behind the stars.
    const bg = c.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#11142a');
    bg.addColorStop(0.6, '#0a0d1f');
    bg.addColorStop(1, '#05060d');
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    // soft nebula tints (matches the CSS radial gradients)
    c.save();
    c.globalAlpha = 0.35;
    const neb1 = c.createRadialGradient(W * 0.3, H * 0.4, 0, W * 0.3, H * 0.4, W * 0.5);
    neb1.addColorStop(0, 'rgba(120, 80, 180, 0.4)');
    neb1.addColorStop(1, 'rgba(120, 80, 180, 0)');
    c.fillStyle = neb1;
    c.fillRect(0, 0, W, H);
    const neb2 = c.createRadialGradient(W * 0.7, H * 0.6, 0, W * 0.7, H * 0.6, W * 0.5);
    neb2.addColorStop(0, 'rgba(80, 140, 220, 0.4)');
    neb2.addColorStop(1, 'rgba(80, 140, 220, 0)');
    c.fillStyle = neb2;
    c.fillRect(0, 0, W, H);
    c.restore();

    // 2. Draw the current stars — we redraw a frame rather than copying
    //    the canvas so we get a clean, sharp moment rather than a half-twinkle.
    const scale = Math.min(W, H) / Math.max(window.innerWidth, window.innerHeight);
    for (const s of stars) {
      const twinkle = (Math.sin(s.phase) + 1) / 2;
      let t = s.sharpness !== 1 ? Math.pow(twinkle, s.sharpness) : twinkle;
      const brightness = (1 - s.depth) + t * s.depth;
      const alpha = s.baseAlpha * brightness;
      if (alpha < 0.02) continue;

      const [cr, cg, cb] = s.color;
      const x = s.x * (W / window.innerWidth);
      const y = s.y * (H / window.innerHeight);
      const r = s.r * (W / window.innerWidth);

      if (s.spiky) {
        c.save();
        c.translate(x, y);
        c.globalAlpha = alpha;
        // glow
        const glow = c.createRadialGradient(0, 0, 0, 0, 0, r * 4);
        glow.addColorStop(0, `rgba(${cr},${cg},${cb},0.55)`);
        glow.addColorStop(0.35, `rgba(${cr},${cg},${cb},0.15)`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = glow;
        c.beginPath();
        c.arc(0, 0, r * 4, 0, Math.PI * 2);
        c.fill();
        // star spikes
        c.fillStyle = `rgba(${cr},${cg},${cb},1)`;
        const long = r * 3.2, short = r * 0.45;
        c.beginPath();
        c.moveTo(0, -long); c.lineTo(short, 0); c.lineTo(0, long); c.lineTo(-short, 0); c.closePath();
        c.moveTo(-long, 0); c.lineTo(0, -short); c.lineTo(long, 0); c.lineTo(0, short); c.closePath();
        c.fill();
        // center
        c.fillStyle = `rgba(${Math.min(255, cr + 40)},${Math.min(255, cg + 40)},${Math.min(255, cb + 40)},1)`;
        c.beginPath();
        c.arc(0, 0, r * 0.6, 0, Math.PI * 2);
        c.fill();
        c.restore();
      } else {
        c.save();
        c.globalAlpha = alpha;
        if (r > 0.8) {
          const g = c.createRadialGradient(x, y, 0, x, y, r * 2.5);
          g.addColorStop(0, `rgba(${cr},${cg},${cb},0.5)`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          c.fillStyle = g;
          c.beginPath();
          c.arc(x, y, r * 2.5, 0, Math.PI * 2);
          c.fill();
        }
        c.fillStyle = `rgba(${cr},${cg},${cb},1)`;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // 3. Top-left brand + tagline
    const brandSize = Math.round(H * 0.035);
    c.textBaseline = 'top';
    c.textAlign = 'left';
    c.fillStyle = '#f3ecd8';
    c.font = `italic 400 ${brandSize}px "Cormorant Garamond", "Times New Roman", serif`;
    c.fillText('✦ Starcatcher', Math.round(W * 0.04), Math.round(H * 0.04));

    // 4. Streak count (bottom-center)
    const streakBig = Math.round(H * 0.06);
    c.textAlign = 'center';
    c.fillStyle = '#f9e7a8';
    c.font = `italic 500 ${streakBig}px "Cormorant Garamond", "Times New Roman", serif`;
    const streakY = H - Math.round(H * 0.08);
    c.fillText(`${streak} caught`, W / 2, streakY);

    // 5. Footer band with the site URL (burned into the image)
    const footerY = H;
    const grad = c.createLinearGradient(0, footerY, 0, footerY + footerH);
    grad.addColorStop(0, 'rgba(5, 6, 13, 0.98)');
    grad.addColorStop(1, '#0a0d1f');
    c.fillStyle = grad;
    c.fillRect(0, footerY, W, footerH);
    // divider
    c.fillStyle = 'rgba(249, 231, 168, 0.45)';
    c.fillRect(0, footerY, W, 1);
    // text
    const footerFont = Math.round(footerH * 0.42);
    c.fillStyle = '#f9e7a8';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = `italic 300 ${footerFont}px "Cormorant Garamond", "Times New Roman", serif`;
    c.fillText(`✦   Catch your own stars at ${SITE_URL}`, W / 2, footerY + footerH / 2);

    return out;
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob) resolve(blob);
        else reject(new Error('Failed to encode image'));
      }, 'image/png');
    });
  }

  async function openSharePopup() {
    // Reset state
    copyStatus.textContent = '';
    copyImgBtn.disabled = true;
    downloadImgBtn.disabled = true;
    sharePreview.innerHTML = 'Preparing preview…';
    shareBtn.classList.add('working');
    shareOverlay.classList.add('active');

    try {
      // Give the overlay a tick to paint so the UI feels responsive
      await new Promise(r => requestAnimationFrame(r));

      const canvas = buildShareCanvas();
      const blob = await canvasToBlob(canvas);
      currentShareBlob = blob;

      // Show preview
      const url = URL.createObjectURL(blob);
      sharePreview.innerHTML = '';
      const img = document.createElement('img');
      img.alt = 'Your starry sky';
      img.src = url;
      sharePreview.appendChild(img);
      sharePreview.dataset.objectUrl = url;

      copyImgBtn.disabled = false;
      downloadImgBtn.disabled = false;
      downloadImgBtn.classList.remove('primary');
      // Check whether clipboard copy will even work here; disable the button proactively if not.
      updateCopyAvailability();
    } catch (err) {
      console.error('Share build failed:', err);
      sharePreview.textContent = "Couldn't prepare the image. Close and try again.";
      showShareToast("Something went wrong. Try again in a moment.");
    } finally {
      shareBtn.classList.remove('working');
    }
  }

  function closeSharePopup() {
    shareOverlay.classList.remove('active');
    // Clean up object URL after transition
    setTimeout(() => {
      if (sharePreview.dataset.objectUrl) {
        URL.revokeObjectURL(sharePreview.dataset.objectUrl);
        delete sharePreview.dataset.objectUrl;
      }
      sharePreview.innerHTML = 'Preparing preview…';
      currentShareBlob = null;
      copyStatus.textContent = '';
    }, 500);
  }

  // Detect whether the clipboard API is actually usable in this document.
  // Common reasons it isn't: the page is inside an iframe without clipboard-write
  // permission policy (like Claude artifacts, codepen previews, some CMS embeds),
  // or the browser simply doesn't implement ClipboardItem.
  async function canUseClipboard() {
    if (!navigator.clipboard || !window.ClipboardItem) return false;

    // If we're in an iframe, check permissions-policy explicitly when available.
    // Chromium blocks clipboard.write in unpermitted iframes with NotAllowedError.
    const inIframe = window.self !== window.top;
    if (inIframe && document.featurePolicy && document.featurePolicy.allowsFeature) {
      try {
        if (!document.featurePolicy.allowsFeature('clipboard-write')) return false;
      } catch (e) { /* older API, ignore */ }
    }
    if (inIframe && document.permissionsPolicy && document.permissionsPolicy.allowsFeature) {
      try {
        if (!document.permissionsPolicy.allowsFeature('clipboard-write')) return false;
      } catch (e) { /* ignore */ }
    }

    // As a last-resort probe, check the permissions API (not supported everywhere)
    try {
      if (navigator.permissions && navigator.permissions.query) {
        const p = await navigator.permissions.query({ name: 'clipboard-write' });
        if (p.state === 'denied') return false;
      }
    } catch (e) { /* permission name not supported, proceed optimistically */ }

    return true;
  }

  // Update the copy button's availability message proactively when the popup opens
  async function updateCopyAvailability() {
    const ok = await canUseClipboard();
    if (!ok) {
      copyImgBtn.disabled = true;
      copyStatus.textContent = 'not available here';
      copyImgBtn.title = "This browser or page embedding doesn't allow direct clipboard copying. Use Download instead.";
      // Visually promote download as the primary action
      copyImgBtn.classList.remove('primary');
      downloadImgBtn.classList.add('primary');
    } else {
      copyImgBtn.disabled = false;
      copyStatus.textContent = '';
      copyImgBtn.title = '';
      copyImgBtn.classList.add('primary');
      downloadImgBtn.classList.remove('primary');
    }
  }

  function copyImageToClipboard() {
    if (!currentShareBlob) return;

    // Not all browsers support ClipboardItem at all
    if (!navigator.clipboard || !window.ClipboardItem) {
      tryWebShareOrFail();
      return;
    }

    // IMPORTANT for Safari + older Chrome: the ClipboardItem must be created
    // synchronously inside the user gesture. Passing a Promise<Blob> is allowed
    // and lets the blob resolve later without losing the gesture context.
    try {
      const item = new ClipboardItem({
        'image/png': Promise.resolve(currentShareBlob)
      });

      navigator.clipboard.write([item]).then(() => {
        copyStatus.textContent = 'copied';
        showShareToast("Copied! Paste it into any chat — the link is on the image.");
      }).catch((err) => {
        console.warn('Clipboard image write blocked:', err && err.name);
        handleClipboardBlocked(err);
      });
    } catch (err) {
      console.warn('ClipboardItem creation failed:', err);
      handleClipboardBlocked(err);
    }
  }

  // Called when clipboard image write is blocked (usually NotAllowedError from
  // permissions-policy in iframes). Try progressively weaker fallbacks.
  function handleClipboardBlocked(originalErr) {
    // Try text-only copy first — this often works even when image copy is blocked.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(SHARE_FULL_TEXT).then(() => {
        copyStatus.textContent = 'link copied';
        showShareToast("Couldn't copy the image here, but the link is on your clipboard.");
      }).catch(() => {
        tryWebShareOrFail();
      });
    } else {
      tryWebShareOrFail();
    }
  }

  function tryWebShareOrFail() {
    if (!currentShareBlob) return;
    if (navigator.canShare) {
      try {
        const file = new File([currentShareBlob], 'starcatcher.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], text: SHARE_FULL_TEXT, title: 'Starcatcher' })
            .then(() => { copyStatus.textContent = 'shared'; })
            .catch((e) => {
              if (e && e.name === 'AbortError') return;
              offerDownloadFallback();
            });
          return;
        }
      } catch (e) { /* fall through */ }
    }
    offerDownloadFallback();
  }

  function offerDownloadFallback() {
    // Show the popup's inline tip: tell them download is their best bet here.
    copyStatus.textContent = 'use download';
    showShareToast("This page can't copy directly — tap Download instead.");
    downloadImgBtn.classList.add('primary');
    // Subtle shake to draw attention
    downloadImgBtn.animate(
      [
        { transform: 'translateX(0)' },
        { transform: 'translateX(-4px)' },
        { transform: 'translateX(4px)' },
        { transform: 'translateX(-3px)' },
        { transform: 'translateX(0)' }
      ],
      { duration: 420, easing: 'ease-out' }
    );
  }

  function downloadImage() {
    if (!currentShareBlob) return;
    const url = URL.createObjectURL(currentShareBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `starcatcher-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showShareToast("Saved to your downloads. Share away.");
  }

  // Wire up
  shareBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openSharePopup();
  });
  shareBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); });

  copyImgBtn.addEventListener('click', copyImageToClipboard);
  downloadImgBtn.addEventListener('click', downloadImage);
  shareCloseBtn.addEventListener('click', closeSharePopup);
  shareOverlay.addEventListener('click', (e) => {
    if (e.target === shareOverlay) closeSharePopup();
  });
  // Stop inner share-card clicks from catching stars
  shareOverlay.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && shareOverlay.classList.contains('active')) closeSharePopup();
  });

  function spawnShootingStar() {
    // Random start edge (top or left), diagonal flight across
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;

    // Angle between 20° and 40° below horizontal for a classic look
    const angleDeg = 20 + Math.random() * 20;
    const angleRad = angleDeg * Math.PI / 180;

    // Choose a start position: mostly top edge, sometimes top-left
    const fromLeft = Math.random() < 0.5;
    let startX, startY, endX, endY;

    if (fromLeft) {
      startX = -150;
      startY = Math.random() * viewH * 0.6;
      const travel = viewW + 300;
      endX = startX + travel;
      endY = startY + travel * Math.tan(angleRad);
    } else {
      startX = Math.random() * viewW * 0.6;
      startY = -150;
      const travel = viewH + 300;
      endY = startY + travel;
      endX = startX + travel / Math.tan(angleRad);
    }

    // Element
    const star = document.createElement('div');
    star.className = 'shooter';

    // Build SVG: a four-point star head with a tapered trail
    const size = 80; // bounding
    const headR = 7;
    // tail extends to the LEFT of the head (opposite to motion direction)
    star.innerHTML = `
      <svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="trail" x1="0" x2="1" y1="0.5" y2="0.5">
            <stop offset="0%"   stop-color="rgba(255,244,214,0)"/>
            <stop offset="60%"  stop-color="rgba(255,230,170,0.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.95)"/>
          </linearGradient>
          <radialGradient id="head" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%"  stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#fff4d6"/>
            <stop offset="100%" stop-color="rgba(255,220,140,0)"/>
          </radialGradient>
        </defs>
        <!-- Trail -->
        <path d="M 0 20 Q 60 18 150 20 Q 60 22 0 20 Z" fill="url(#trail)"/>
        <!-- Glow halo -->
        <circle cx="155" cy="20" r="14" fill="url(#head)" opacity="0.9"/>
        <!-- Four-point star head -->
        <path d="M 155 6 L 158 20 L 155 34 L 152 20 Z
                 M 141 20 L 155 17 L 169 20 L 155 23 Z"
              fill="#ffffff"/>
        <!-- Hitbox boost (invisible) for easier tapping -->
        <circle cx="155" cy="20" r="22" fill="rgba(255,255,255,0.001)"/>
      </svg>
    `;

    // Initial transform — position at start, rotate to match travel direction
    const angle = Math.atan2(endY - startY, endX - startX);
    star.style.left = '0px';
    star.style.top = '0px';
    star.style.transform = `translate(${startX}px, ${startY}px) rotate(${angle}rad)`;
    star.style.opacity = '0';

    layer.appendChild(star);

    // Animate using Web Animations API
    // Harder mix: more fast streaks, slow ones are slower overall but catch window is much tighter.
    let duration;
    const speedRoll = Math.random();
    if (speedRoll < 0.5) {
      duration = 700 + Math.random() * 500;   // 0.7–1.2s — blink-and-you-miss-it (50%)
    } else {
      duration = 3000 + Math.random() * 1000; // 3.0–4.0s — the "slow" ones (still brisk)
    }

    const anim = star.animate(
      [
        { transform: `translate(${startX}px, ${startY}px) rotate(${angle}rad)`, opacity: 0 },
        { transform: `translate(${startX + (endX-startX)*0.1}px, ${startY + (endY-startY)*0.1}px) rotate(${angle}rad)`, opacity: 1, offset: 0.08 },
        { transform: `translate(${startX + (endX-startX)*0.9}px, ${startY + (endY-startY)*0.9}px) rotate(${angle}rad)`, opacity: 1, offset: 0.92 },
        { transform: `translate(${endX}px, ${endY}px) rotate(${angle}rad)`, opacity: 0 }
      ],
      { duration, easing: 'cubic-bezier(0.2, 0.6, 0.3, 1)', fill: 'forwards' }
    );

    // Mark this star as catchable globally — but close the window well before
    // it leaves the screen. You have to react while it's clearly in the sky.
    const starRef = { element: star, animation: anim, caught: false };
    activeStar = starRef;
    document.body.classList.add('catching');

    function handleMiss() {
      if (starRef.caught) return;
      if (activeStar === starRef) {
        activeStar = null;
        document.body.classList.remove('catching');
      }
      // Show the miss dialogue on every missed star
      showMissToast();
      // Visually break the streak counter (only meaningful if it was > 0)
      if (streak > 0) {
        streak = 0;
        countEl.textContent = streak;
        counterEl.classList.remove('bump', 'break');
        void counterEl.offsetWidth;
        counterEl.classList.add('break');
      }
    }

    // Close catch window at 70% of the animation — must catch it mid-flight.
    const catchWindow = duration * 0.70;
    setTimeout(handleMiss, catchWindow);

    anim.onfinish = () => {
      if (star.parentNode) star.remove();
    };
  }

  function scheduleNext() {
    const delay = 15000 + Math.random() * 20000; // 15–35s
    setTimeout(() => {
      spawnShootingStar();
      scheduleNext();
    }, delay);
  }

  // First shooting star a little sooner so the user sees one early
  setTimeout(spawnShootingStar, 4000 + Math.random() * 4000);
  scheduleNext();

  // Gentle: if tab becomes visible again, don't pile up stars — scheduling already uses setTimeout so we're fine.
})();
</script>
</body>
